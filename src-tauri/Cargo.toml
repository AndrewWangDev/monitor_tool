[package]
name = "tauri-app"
version = "0.1.0"
description = "A lightweight system status monitor for Windows"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37.2"

[profile.release]
opt-level = "z"        # Optimize aggressively for binary size
lto = "thin"           # Fast Link Time Optimization
codegen-units = 1      # Maximize size optimizations
panic = "abort"        # Remove unwinding tables
strip = true           # Automatically strip symbols from the binary
